# Catalog listing template
# Synced to Field Catalog / PostgreSQL per platform conventions. Each offering should follow this shape.

# demo_id: Auto-incremented primary key (managed by database; do not include in new entries)

# Required fields
title: "Example Offering Title"  # Required, max 500 characters

# Industry and categorization (Field Catalog)
#
# The Field Catalog sync sets team/function from pipeline config (e.g. SSA). Do NOT add team_function
# to this YAML unless product explicitly requires it later.
#
# `industry` is ONLY for customer vertical scope (not "SSA" and not team):
#   - Global offering (all verticals / typical default): OMIT the `industry` key entirely.
#     That stores as NULL and surfaces in "all industries" and when users filter by a specific industry.
#   - Vertical-specific: set `industry` to ONE Field Catalog vertical code used by the DB/UI
#     (e.g. FINS, CME, HLS, MFG, RCT, E&U, X-industry, PUBSEC—match the catalog; do not invent labels).
#     Then the offering appears only when that vertical is selected, not in the global "all industries" view.
# If scope is unclear, omit `industry` (global). Never use industry: "SSA"—that was a legacy placeholder.
#
# secondary_industry / subvertical: optional extra granularity; separate columns from `industry`.
secondary_industry: "Financial Services"  # Max 255 characters, optional
subvertical: "Insurance"  # Max 255 characters, optional

# Status and priority
status: "Complete"  # Max 50 characters (e.g., Complete, In Progress)
strategic_priority: "High"  # Max 50 characters (e.g., High, Medium, Low)

# Ownership and responsibility
demo_owner: "john.doe@company.com"  # Max 255 characters
industry_lead: "jane.smith@company.com"  # Max 255 characters

# Links to internal resources
# Allowed keys may include: pitch_deck, genie, reprise, yoodli, dbdemos, personas, recording,
# case_studies, app, github, demo, marketing, script, dashboard (use only what applies)
links:
  pitch_deck: https://example.com/your-deck  # Max 255 characters per value

# Business alignment
imperative: "Revenue Growth"  # Max 255 characters
business_outcome: "Reduce customer churn by 20%"  # Max 255 characters

# Quality and maintenance flags
needs_fix: false  # Boolean: true if offering requires fixes
business_user_friendly: false  # Boolean: true if suitable for business users

# Timeline
expected_delivery: "Q2 2025"  # Max 255 characters
last_certified: "2025-01-15"  # Date format: YYYY-MM-DD

# Products and features (comma-separated lists)
products: "Databricks SQL, Delta Lake, MLflow"  # Text field, comma-separated
product_lines: "Data Engineering, Machine Learning"  # Text field, comma-separated

# Partner information
partner_developed: false  # Boolean: true if developed by partner
partner: ""  # Max 255 characters; partner company name when partner_developed is true

# Description and details
demo_description: |
  Markdown-formatted description of the catalog listing.

# Installation availability
installable: true  # Boolean: true if dbdemos, GitHub, or similar installation paths exist
